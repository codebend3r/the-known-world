[build]
  command = """
  set -e
  echo '💅 Prettier'
  bun run prettier:check
  echo '🔎 Typecheck'
  bun run typecheck
  echo '🧹 Lint'
  bun run lint
  echo '🧪 Test'
  bun run test
  echo '🏗️ Build'
  bun run build
  """
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
