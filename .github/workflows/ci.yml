name: CI

on: push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 💅 Prettier
        run: bun run prettier:check

      - name: 🔎 Typecheck
        run: bun run typecheck

      - name: 🧹 Lint
        run: bun run lint

      - name: 🧪 Test
        run: bun run test

      - name: 🏗️ Build
        run: bun run build
